<div class="container">
  <div class="marked advantages_title">{{ 'ADVANTAGES_TITLE' | translate }}</div>
  <div class="row text-center ">
    <div class="col-lg col-12 " *ngFor="let item of advantages">
      <div class="stat-item">
        <div class="icon-wrapper">
          <i class="bi " [ngClass]="item.icon"></i>
        </div>
        <p class="marked">{{ item.title }}</p>
        <p>{{ item.description }}</p>
      </div>
    </div>
  </div>
</div>
