<div class="advantage">
  <div class="container">
    <div class="row text-center">
      <div class="col-lg col-12"  *ngFor="let item of reasons">
        <div class="stat-item">
          <div class="icon-wrapper">
            <i class="bi " [ngClass]="item.icon"></i>
          </div>
          <h6>{{ item.title }}</h6>
          <p>{{ item.description }}</p>
        </div>
      </div>
    </div>
  </div>
</div>
