<div class="advantage">
  <div class="container">
    <div class="row text-center">
      <div class="col-lg col-12"  *ngFor="let item of reasons">
        <div class="stat-item">
          <div class="icon-wrapper">
            <i class="bi " [ngClass]="item.icon"></i>
          </div>
          <div class="title">{{ item.title }}</div>
          <p class="description">{{ item.description }}</p>
        </div>
      </div>
    </div>
  </div>
</div>
