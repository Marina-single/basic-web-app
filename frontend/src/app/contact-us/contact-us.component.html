<div class="contact-container">
<div class="container" >
<h2 id="contact-us">{{ 'CONTACT_US' | translate }}</h2>

   <div class="parent row">
     <div id="contact-form" class="col-lg-8 col-md-12 col-12">
     <form action="">
      <div class="contact-el">
        <label for="name">{{ 'CONTACT_US_NAME' | translate }}*:</label>
        <input type= "text" id="name" name="name" required>
      </div>
      <div class="contact-el">
        <label for="email">{{ 'CONTACT_US_EMAIL' | translate }}*:</label>
        <input type="email" id="email" name="email" required>
      </div>
      <div class="contact-el">
        <label for="number">{{ 'CONTACT_US_PHONE' | translate }}*:</label>
        <input type="tel" id="number" name="number" required>
      </div >
      <div class="contact-el">
        <label for="message">{{ 'CONTACT_US_MESSAGE' | translate }}</label>
        <textarea id="message" name="message"></textarea>
      </div>
        <button type="submit">{{ 'Send' | translate }}</button>
     </form>
     </div>
     <div id="email-phone-address" class="col-lg-4 col-md-12 col-12 background-banner">
      <div class="contact-element phone-number">+49 176 30430423</div>
      <div class="contact-element mail">info&#64;1source-relocation.de</div>
      <div class="contact-element address">Forsmannstrasse 10, 22303, Hamburg </div>
      <div class="support24"><i class="bi bi-clock support24" style="margin-right:4px;"> </i>24/7 Support </div>
     </div>
  </div>
</div>
</div>
